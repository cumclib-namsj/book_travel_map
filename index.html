<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈️ Book Travel Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --navy: #2d7a7a;
    --navy-mid: #2d7a7a;
    --navy-light: #3d8888;
    --gold: #f5a623;
    --gold-light: #f8c96b;
    --sky: #c8b0a8;
    --cream: #fff0ec;
    --panel-bg: rgba(15,50,50,0.96);
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #2d7a7a;
    color: var(--cream);
  }

  /* ── HEADER ── */
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1100;
    height: 60px;
    background: linear-gradient(90deg, #1e5858 0%, #2d7a7a 50%, #1e5858 100%);
    border-bottom: 1.5px solid rgba(245,166,35,0.5);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
  }
  .h-left { display:flex; align-items:baseline; gap:10px; min-width: 0; flex: 1; }
  .h-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px; color: var(--gold-light);
    letter-spacing: 0.3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .h-sub { font-size: 11px; color: var(--sky); letter-spacing: 1.2px; white-space: nowrap; }
  .h-right { display:flex; align-items:center; gap:10px; justify-content: flex-end; flex-shrink: 0; }
  .stat-pill {
    background: rgba(245,166,35,0.12);
    border: 1px solid rgba(245,166,35,0.3);
    border-radius: 20px; padding: 4px 14px;
    font-size: 12px; color: var(--sky);
  }
  .stat-pill b { color: var(--gold-light); font-size: 15px; margin-right: 2px; }
  .rec-btn {
    background: linear-gradient(135deg, #f5a623, #f8c96b);
    color: #071d3a; border: none; border-radius: 20px;
    padding: 8px 18px; font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px; font-weight: 700; cursor: pointer;
    box-shadow: 0 3px 14px rgba(245,166,35,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .rec-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 20px rgba(245,166,35,0.5); }

  /* ── MAP ── */
  #map {
    position: fixed; top: 60px; left: 0; right: 0; bottom: 0;
    z-index: 1;
  }
  .leaflet-container { background: #2d7a7a !important; }





  /* ── BOTTOM PANEL (web mode) ── */
  #panel {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 1200;
    background: var(--panel-bg);
    border-top: 1.5px solid rgba(245,166,35,0.4);
    backdrop-filter: blur(14px);
    transform: translateY(100%);
    transition: transform 0.38s cubic-bezier(0.25,0.46,0.45,0.94);
    max-height: 52vh; display: flex; flex-direction: column;
  }
  #panel.open { transform: translateY(0); }
  #panel-head {
    padding: 13px 20px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.07); flex-shrink: 0;
  }
  #panel-country { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--gold-light); }
  #panel-cnt {
    font-size: 11px; color: var(--sky);
    background: rgba(245,166,35,0.13);
    border: 1px solid rgba(245,166,35,0.3);
    border-radius: 10px; padding: 3px 10px;
  }
  #panel-close {
    background: none; border: none; color: var(--sky); font-size: 18px;
    cursor: pointer; width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  #panel-close:hover { background: rgba(255,255,255,0.1); }
  #cards-wrap {
    display: flex; gap: 14px; padding: 14px 20px 18px;
    overflow-x: auto; overflow-y: hidden; flex: 1;
    scrollbar-width: thin; scrollbar-color: rgba(245,166,35,0.3) transparent;
  }
  #cards-wrap::-webkit-scrollbar { height: 4px; }
  #cards-wrap::-webkit-scrollbar-thumb { background: rgba(245,166,35,0.3); border-radius: 4px; }
  .book-card {
    flex-shrink: 0; width: 195px;
    background: rgba(15,45,45,0.75);
    border: 1px solid rgba(245,166,35,0.2);
    border-radius: 14px; overflow: hidden;
    transition: transform 0.18s, border-color 0.18s;
    cursor: pointer;
  }
  .book-card:hover { transform: translateY(-3px); border-color: rgba(245,166,35,0.55); }
  .book-thumb {
    width: 100%; height: 110px;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    background: linear-gradient(135deg, #1a6060, #0d4040);
    overflow: hidden; flex-shrink: 0;
  }
  .book-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .book-body { padding: 10px 12px 12px; }
  .book-title { font-size: 12px; font-weight: 700; color: var(--cream); line-height: 1.45; margin-bottom: 4px; }
  .book-city { font-size: 10px; color: var(--gold); margin-bottom: 5px; }
  .book-reason {
    font-size: 10px; color: var(--sky); line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .book-link {
    display: inline-block; margin-top: 8px;
    font-size: 10px; color: var(--gold-light);
    border: 1px solid rgba(245,166,35,0.3); border-radius: 8px; padding: 3px 9px;
    text-decoration: none; transition: background 0.18s;
  }
  .book-link:hover { background: rgba(245,166,35,0.14); }

  /* ── SCREEN PANEL (screen mode) ── */
  #screen-panel {
    position: fixed; top: 60px; right: 0; bottom: 0; z-index: 1050;
    width: 596px;
    background: rgba(15,50,50,0.93);
    border-left: 1.5px solid rgba(245,166,35,0.3);
    backdrop-filter: blur(14px);
    display: none; flex-direction: column;
    padding: 18px 16px 14px;
  }
  #screen-panel.show { display: flex; }
  .sc-label { font-size: 9px; color: var(--sky); letter-spacing: 1.6px; text-transform: uppercase; margin-bottom: 5px; }
  #sc-country { font-family: 'Playfair Display', serif; font-size: 30px; color: var(--gold-light); margin-bottom: 2px; }
  #sc-cnt { font-size: 11px; color: var(--sky); margin-bottom: 12px; }
  .sc-book-wrap {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    min-height: 0;
  }
  .sc-card {
    background: rgba(15,45,45,0.75);
    border: 1px solid rgba(245,166,35,0.2);
    border-radius: 14px; overflow: hidden;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .sc-card-cover {
    width: 100%; flex: 3;
    background: linear-gradient(135deg, #1a6060, #0d4040);
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; overflow: hidden; min-height: 0;
  }
  .sc-card-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sc-card-body {
    padding: 10px 12px 12px;
    flex: 2; overflow: hidden;
    display: flex; flex-direction: column; gap: 5px; min-height: 0;
  }
  .sc-card-title { font-size: 26px; font-weight: 700; color: var(--cream); line-height: 1.4; }
  .sc-card-city { font-size: 18px; color: var(--gold); }
  .sc-card-reason { font-size: 18px; color: var(--sky); line-height: 1.6; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
  .progress-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 16px; }
  .progress-fill { height: 100%; width: 0%; border-radius: 2px; background: linear-gradient(90deg, #f5a623, #f8c96b); transition: width 0.05s linear; }
  .sc-dots { display: flex; gap: 6px; margin-top: 12px; }
  .sc-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.18); transition: background 0.3s; }
  .sc-dot.on { background: #f5a623; }


  /* ── MOBILE ── */
  @media (max-width: 600px) {
    #header { height: 52px; padding: 0 12px; }
    .h-title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
    .h-sub { display: none; }
    .stat-pill { padding: 3px 8px; font-size: 11px; }
    .stat-pill b { font-size: 13px; }
    .rec-btn { padding: 6px 12px; font-size: 11px; }
    #dev-toggle { display: none; }
    #map { top: 52px; }
    #screen-panel { top: 52px; }
    #panel { max-height: 48vh; }
    #panel-head { padding: 10px 14px 8px; }
    #panel-country { font-size: 16px; }
    #cards-wrap { padding: 10px 14px 14px; gap: 10px; }
    .book-card { width: 160px; }
    .book-thumb { height: 80px; font-size: 28px; }
    .book-body { padding: 8px 10px 10px; }
    .book-title { font-size: 12px; }
    .book-city { font-size: 10px; }
    .book-reason { font-size: 10px; -webkit-line-clamp: 2; }
    .book-link { font-size: 10px; }
  }
  /* ── PINS ── */
  /* Leaflet 마커 클릭 영역 활성화 */
  .leaflet-marker-icon { pointer-events: auto !important; cursor: pointer !important; }
  /* 웹 핀 — ripple 없음, head만 */
  .pin-head {
    position: absolute; top: 4px; left: 4px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f8c96b, #e8900a);
    border: 2px solid rgba(255,240,180,0.6);
    box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    color: #071d3a; font-weight: 700; line-height: 1;
  }
  .pin-tail {
    position: absolute;
    width: 0; height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 11px solid #c87010;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
  }
  /* 스크린 모드 강조 핀 */
  .pin-head-active {
    background: radial-gradient(circle at 35% 30%, #fff5a0, #ffcc00) !important;
    border-color: rgba(255,255,200,0.9) !important;
    box-shadow: 0 0 16px 4px rgba(255,200,0,0.7) !important;
    transform: scale(1.25);
  }
  .pin-tail-active { border-top-color: #cc9900 !important; }
  .pin-ring-active {
    position: absolute; border-radius: 50%;
    background: rgba(255,220,80,0.5);
    animation: ripple-active 1.4s ease-out infinite;
    pointer-events: none;
  }
  @keyframes ripple-active {
    0%   { transform: scale(0.9); opacity: 0.9; }
    100% { transform: scale(3.8); opacity: 0; }
  }


  /* leaflet popup */
  .leaflet-popup-content-wrapper {
    background: rgba(15,50,50,0.96) !important;
    border: 1px solid rgba(245,166,35,0.4) !important;
    border-radius: 10px !important; color: var(--cream) !important;
    box-shadow: 0 8px 28px rgba(0,0,0,0.55) !important;
    backdrop-filter: blur(10px);
  }
  .leaflet-popup-tip-container { display: none; }
  .leaflet-popup-content { margin: 10px 14px !important; font-family: 'Noto Sans KR', sans-serif !important; }
  .pop-title { font-size: 13px; font-weight: 700; color: var(--gold-light); margin-bottom: 2px; }
  .pop-sub { font-size: 11px; color: var(--sky); }
  .leaflet-control-zoom a {
    background: rgba(7,29,58,0.9) !important; color: var(--sky) !important;
    border-color: rgba(245,166,35,0.25) !important;
  }
  .leaflet-control-zoom a:hover { background: rgba(245,166,35,0.2) !important; color: var(--gold-light) !important; }

  /* ── BOOK POPUP ── */
  #book-popup-overlay {
    position: fixed; inset: 0; z-index: 1500;
    background: rgba(4,12,28,0.75);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.22s;
  }
  #book-popup-overlay.show { opacity: 1; pointer-events: all; }
  #book-popup {
    background: rgba(15,50,50,0.96);
    border: 1px solid rgba(245,166,35,0.45);
    border-radius: 18px; width: 100%; max-width: 380px;
    overflow: hidden;
    transform: translateY(14px);
    transition: transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
  }
  #book-popup-overlay.show #book-popup { transform: translateY(0); }
  #popup-cover {
    width: 100%; height: 180px;
    background: linear-gradient(135deg, #1a6060, #0d4040);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
  }
  #popup-cover img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  #popup-cover-placeholder {
    font-size: 56px; opacity: 0.7;
  }
  #popup-head {
    padding: 16px 18px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  #popup-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--cream); line-height: 1.35; flex: 1; }
  #popup-close {
    background: none; border: none; color: var(--sky); font-size: 20px;
    cursor: pointer; width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.18s; margin-top: -2px;
  }
  #popup-close:hover { background: rgba(255,255,255,0.1); }
  #popup-body { padding: 14px 18px 18px; }
  #popup-city { font-size: 13px; color: var(--gold); margin-bottom: 12px; }
  #popup-reason { font-size: 14px; color: var(--sky); line-height: 1.75; margin-bottom: 16px; }
  #popup-link {
    display: inline-block; font-size: 13px; color: var(--gold-light);
    border: 1px solid rgba(245,166,35,0.35); border-radius: 10px; padding: 8px 16px;
    text-decoration: none; transition: background 0.18s;
  }
  #popup-link:hover { background: rgba(245,166,35,0.14); }
</style>
</head>

<!-- HEADER -->

    <button id="dev-toggle" onclick="devToggle()" title="개발용 모드 전환" style="background:none;border:none;cursor:pointer;padding:4px 6px;opacity:0.15;color:var(--sky);font-size:10px;letter-spacing:0.5px;transition:opacity 0.2s;" onmouseover="this.style.opacity='0.6'" onmouseout="this.style.opacity='0.15'">DEV</button>

<!-- MAP -->
<div id="map"></div>




<!-- BOTTOM PANEL (web mode) -->
<div id="panel">

</div>

<!-- SCREEN PANEL (screen mode) -->
<div id="screen-panel">

  "Somalia":[5.2,46.2],"South Africa":[-29.0,25.1],"South Korea":[35.9,127.8],
  "South Sudan":[7.9,29.7],"Spain":[40.5,-3.7],"Sri Lanka":[7.9,80.8],
  "Sudan":[15.6,30.2],"Sweden":[60.1,18.6],"Switzerland":[46.8,8.2],
  "Syria":[34.8,38.9],"Taiwan":[23.7,121.0],"Tajikistan":[38.9,71.3],
  "Tanzania":[-6.4,34.9],"Thailand":[15.9,100.9],"Togo":[8.6,0.8],
  "Tunisia":[33.9,9.6],"Turkey":[38.9,35.2],"Turkmenistan":[38.97,59.6],
  "Uganda":[1.4,32.3],"Ukraine":[48.4,31.2],"United Arab Emirates":[23.4,53.8],
  "United Kingdom":[55.4,-3.4],"United States of America":[37.1,-95.7],
  "Uruguay":[-32.5,-55.8],"Uzbekistan":[41.4,64.6],"Venezuela":[6.4,-66.6],
  "Vietnam":[14.1,108.3],"Yemen":[15.6,48.5],"Zambia":[-13.1,27.8],
  "Zimbabwe":[-20.0,30.0]
};

let DATA = {};  // loadData() 호출 후 채워짐

// ── MAP INIT ──
const map = L.map('map', {
  zoomControl: true,
  attributionControl: false,
  clickTolerance: 10
}).setView([25, 15], 2);

// 타일 없음 — leaflet-container 배경색(#2d7a7a)이 바다색



// countries geojson + API 동시 로드 — 둘 다 완료 후 initMap()
const geoLayers = {};
const geoPromise = fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
  .then(r => r.json())
  .then(geo => {
    L.geoJSON(geo, {
      style: () => ({ fillColor:'#FFE5D9', fillOpacity:0.9, color:'rgba(160,120,80,0.4)', weight:0.6 }),
      onEachFeature: (f, layer) => {
        const name = f.properties.ADMIN || f.properties.name || '';
        if (name) geoLayers[name] = layer;
      }
    }).addTo(map);
  })
  .catch(() => {});

function highlightCountry(country) {
  Object.entries(geoLayers).forEach(([c, layer]) => {
    if (c === country) {
      layer.setStyle({ fillColor:'#f5a623', fillOpacity:0.7, color:'rgba(248,201,107,0.95)', weight:2.5 });
      layer.bringToFront();
    } else if (DATA[c]) {
      layer.setStyle({ fillColor:'#F97068', fillOpacity:0.85, color:'rgba(255,200,180,0.6)', weight:1.2 });
    }
  });
}

// ── URL 파라미터로 모드 자동 분기 ──
// 웹 보기:    index.html
// 스크린 전시: index.html?screen
const IS_SCREEN = new URLSearchParams(window.location.search).has('screen');
const mode = IS_SCREEN ? 'screen' : 'web';

// 웹 모드: 줌 아웃 제한 + 경계 제한
// 스크린 모드: 제한 없음 (flyTo 자유롭게)
function applyWebBounds() {
  map.setMinZoom(2);
  map.setMaxBounds([[-85, -210], [85, 210]]);
  map.options.maxBoundsViscosity = 1.0;
}
function removeWebBounds() {
  map.setMinZoom(0);
  map.setMaxBounds(null);
  map.options.maxBoundsViscosity = 0;
}
if (!IS_SCREEN) applyWebBounds();

// ── MARKERS ──
const markerMap = {};

// 추천 수 → 헤드 크기 (최소 18px, 최대 36px로 고정)
function pinHeadSize(n) {
  return Math.min(18 + (n - 1) * 6, 36);
}

function makePinIcon(n, active=false) {
  const hd = pinHeadSize(n);
  const tail = 12;
  const wrap = hd + 8;
  const cx = Math.round(wrap / 2);
  const label = n > 1 ? `<span style="font-size:${Math.max(8, hd/2.8)}px;">${n}</span>` : '';
  const headCls = active ? 'pin-head pin-head-active' : 'pin-head';
  const tailCls = active ? 'pin-tail pin-tail-active' : 'pin-tail';
  // ripple은 스크린 모드 강조 핀에서만
  const ripple = active
    ? `<div class="pin-ring-active" style="width:${hd}px;height:${hd}px;top:4px;left:4px;"></div>`
    : '';
  return L.divIcon({
    html: `<div style="position:relative;width:${wrap}px;height:${wrap}px;">
      ${ripple}
      <div class="${headCls}" style="width:${hd}px;height:${hd}px;">${label}</div>
      <div class="${tailCls}" style="top:${4+hd-1}px;left:${cx-4}px;"></div>
    </div>`,
    iconSize:   [wrap, wrap],
    iconAnchor: [cx, cx + tail],
    className:  ''
  });
}

function initMap() {
  // 기존 마커 모두 제거
  Object.values(markerMap).forEach(m => m.remove());
  Object.keys(markerMap).forEach(k => delete markerMap[k]);

  // 총 추천 수 업데이트
  const total = Object.values(DATA).reduce((s, d) => s + d.books.length, 0);
  document.getElementById('total-cnt').textContent = total;

  // 마커 생성
  Object.entries(DATA).forEach(([country, d]) => {
    const cnt = d.books.length;
    const m = L.marker([d.lat, d.lng], { icon: makePinIcon(cnt) }).addTo(map);
    m.bindPopup(
      `<div class="pop-title">${country}</div><div class="pop-sub">추천 도서 ${cnt}권</div>`,
      { closeButton: false, offset: [0, -10] }
    );
    m.on('click', () => { if (mode === 'web') { openPanel(country); m.closePopup(); } });
    m.on('mouseover', () => { if (mode === 'web') m.openPopup(); });
    m.on('mouseout',  () => m.closePopup());
    markerMap[country] = m;
  });

  // GeoJSON 육지 스타일 갱신 — 데이터 있는 국가 강조, 클릭 이벤트 등록
  Object.entries(geoLayers).forEach(([name, layer]) => {
    if (DATA[name]) {
      layer.setStyle({
        fillColor: '#F97068', fillOpacity: 0.85,
        color: 'rgba(255,200,180,0.6)', weight: 1.2
      });
      layer.off('click');
      layer.on('click', () => { if (mode === 'web') openPanel(name); });
    } else {
      layer.setStyle({
        fillColor: '#FFE5D9', fillOpacity: 0.9,
        color: 'rgba(160,120,80,0.4)', weight: 0.6
      });
      layer.off('click');
    }
  });

  // 모드 초기화
  if (IS_SCREEN) {
    document.getElementById('screen-panel').classList.add('show');
    document.getElementById('rec-btn').style.display = 'none';
    startScreen();
  }
}

// ── WEB PANEL ──
let currentBooks = [];
function openPanel(country) {
  const d = DATA[country];
  currentBooks = d.books;
  document.getElementById('panel-country').textContent = country;
  document.getElementById('panel-cnt').textContent = `${d.books.length}권`;
  const wrap = document.getElementById('cards-wrap');
  wrap.innerHTML = d.books.map((b, i) => `
    <div class="book-card" onclick="openBookPopup(${i})" style="cursor:pointer;">
      <div class="book-thumb">
        ${b.cover ? `<img src="${b.cover}" alt="${b.title}">` : '📖'}
      </div>
      <div class="book-body">
        <div class="book-title">${b.title}</div>
        ${b.city ? `<div class="book-city">📍 ${b.city}</div>` : ''}
        <div class="book-reason">${b.reason}</div>
        <span class="book-link" style="pointer-events:none;">상세 보기 →</span>
      </div>
    </div>`).join('');
  document.getElementById('panel').classList.add('open');
}
function closePanel() { document.getElementById('panel').classList.remove('open'); }
map.on('click', e => { if (e.originalEvent.target === map._container) closePanel(); });

// ── SCREEN MODE ──
let scTimer = null, scProgInt = null;
let scCountries = [], scCI = 0, scBI = 0;

function startScreen() {
  scCountries = Object.keys(DATA).filter(c => DATA[c].books.length > 0);
  scCI = 0; scBI = 0;
  showScCountry(0);
}
function stopScreen() {
  clearTimeout(scTimer); clearInterval(scProgInt);
}
function showScCountry(ci) {
  scCI = ci % scCountries.length;
  scBI = 0;
  const country = scCountries[scCI];
  const d = DATA[country];
  document.getElementById('sc-country').textContent = country;
  document.getElementById('sc-cnt').textContent = `${d.books.length}권 추천됨`;
  const dots = document.getElementById('sc-dots');
  dots.innerHTML = d.books.map((_, i) =>
    `<div class="sc-dot${i===0?' on':''}"></div>`).join('');
  // A: 강조 핀
  Object.entries(markerMap).forEach(([c, m]) =>
    m.setIcon(makePinIcon(DATA[c].books.length, c === country)));
  // C: 영역 하이라이트
  highlightCountry(country);
  // 오른쪽 패널(596px) → 지도 중심을 오른쪽으로 298px 이동 → 국가가 왼쪽 영역(860px) 중앙에 위치
  const z = 4;
  const pt = map.project([d.lat, d.lng], z);
  const offsetLL = map.unproject([pt.x + 298, pt.y], z);
  map.flyTo(offsetLL, z, { duration: 1.8, animate: true });
  showScBook(country, 0);
}
function makeBookCard(book) {
  if (!book) return '<div></div>';
  const coverHtml = book.cover
    ? `<img src="${book.cover}" alt="${book.title}">`
    : `📖`;
  return `<div class="sc-card">
    <div class="sc-card-cover">${coverHtml}</div>
    <div class="sc-card-body">
      <div class="sc-card-title">${book.title}</div>
      ${book.city ? `<div class="sc-card-city">📍 ${book.city}</div>` : ''}
      <div class="sc-card-reason">${book.reason}</div>
    </div>
  </div>`;
}

function showScBook(country, bi) {
  scBI = bi;
  const d = DATA[country];
  const cur  = d.books[bi % d.books.length];
  const nextIdx = bi + 1;
  const next = (d.books.length > 1 && nextIdx < d.books.length) ? d.books[nextIdx] : null;
  document.getElementById('sc-book-wrap').innerHTML =
    makeBookCard(cur) + (next ? makeBookCard(next) : '<div></div>');
  document.querySelectorAll('.sc-dot').forEach((el, i) =>
    el.classList.toggle('on', i === bi || i === bi + 1));
  clearInterval(scProgInt);
  let p = 0;
  const fill = document.getElementById('prog-fill');
  fill.style.width = '0%';
  // 2개씩 표시, 책 1개당 5초 → 페어당 10초
  const duration = (next ? 2 : 1) * 5000;
  scProgInt = setInterval(() => {
    p += 100 / (duration / 50);
    fill.style.width = p + '%';
    if (p >= 100) {
      clearInterval(scProgInt);
      const nextBI = bi + 2;  // 2개씩 건너뜀
      if (nextBI >= d.books.length) {
        scTimer = setTimeout(() => showScCountry(scCI + 1), 600);
      } else {
        showScBook(country, nextBI);
      }
    }
  }, 50);
}

// 모드 초기화는 loadData() → initMap() 에서 처리


// ── BOOK POPUP ──
function openBookPopup(idx) {
  const b = currentBooks[idx];
  document.getElementById('popup-title').textContent = b.title;
  document.getElementById('popup-city').textContent = b.city ? '📍 ' + b.city : '';
  document.getElementById('popup-reason').textContent = b.reason;
  document.getElementById('popup-link').href = b.link || '#';
  const cover = document.getElementById('popup-cover');
  const placeholder = document.getElementById('popup-cover-placeholder');
  const existingImg = cover.querySelector('img');
  if (existingImg) existingImg.remove();
  if (b.cover) {
    const img = document.createElement('img');
    img.src = b.cover;
    img.alt = b.title;
    cover.appendChild(img);
    placeholder.style.display = 'none';
  } else {
    placeholder.style.display = '';
  }
  document.getElementById('book-popup-overlay').classList.add('show');
}
function closeBookPopup() {
  document.getElementById('book-popup-overlay').classList.remove('show');
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('book-popup-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeBookPopup();
  });
  document.getElementById('popup-close').addEventListener('click', closeBookPopup);
});
// ── GeoJSON + API 동시 로드, 둘 다 완료 후 initMap() ──
document.getElementById('total-cnt').textContent = '...';

const apiPromise = fetch(API_URL)
  .then(r => r.json());

Promise.all([geoPromise, apiPromise])
  .then(([, apiData]) => {
    DATA = {};
    Object.entries(apiData).forEach(([country, books]) => {
      const coords = COORDS[country];
      if (!coords || !books.length) return;
      DATA[country] = {
        lat: coords[0], lng: coords[1],
        books: books.map(b => ({
          title:  b.title  || '',
          city:   b.city   || '',
          reason: b.reason || '',
          link:   b.library_url || '#',
          cover:  b.cover  || ''
        }))
      };
    });
    initMap();
  })
  .catch(err => {
    console.error('로드 실패:', err);
    document.getElementById('total-cnt').textContent = '오류';
  });

// ── 개발용 모드 전환 (배포 전 제거) ──
function devToggle() {
  const sp = document.getElementById('screen-panel');
  const rb = document.getElementById('rec-btn');
  const isNowScreen = !sp.classList.contains('show');
  if (isNowScreen) {
    sp.classList.add('show');
    rb.style.display = 'none';
    closePanel();
    removeWebBounds();
    startScreen();
  } else {
    sp.classList.remove('show');
    rb.style.display = '';
    stopScreen();
    applyWebBounds();
  }
}
</script>
